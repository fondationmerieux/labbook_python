name: CodeQL

# Replaces the default setup configured in the repository settings, which has no way
# to exclude a path. The exclusion itself lives in .github/codeql/codeql-config.yml
# and keeps the vendored libraries (static/vendor) out of the analysis.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '36 14 * * 4'

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          quality-queries: code-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
